name: CI - Contacts Directory Enterprise

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-and-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Backend Dependencies
        run: dotnet restore Backend/API/API/API.csproj

      - name: Build Backend Solution
        run: dotnet build Backend/API/API/API.csproj -c Release --no-restore

      - name: Run Architecture Verification Suite
        run: python3 scripts/verify_contacts_engine.py

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Verify Strict Zero Em-Dashes Policy
        run: |
          python3 -c "
          from pathlib import Path
          files = [Path('README.md'), Path('docker/init.sql'), Path('docker-compose.yml'), Path('.gitignore')]
          for f in files:
              if f.exists() and '\u2014' in f.read_text(encoding='utf-8', errors='ignore'):
                  raise SystemExit(f'Em-dash found in {f.name}')
          print('ZERO EM-DASHES VERIFIED')
          "
