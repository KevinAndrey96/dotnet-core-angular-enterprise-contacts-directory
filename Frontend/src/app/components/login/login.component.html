<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 rounded-lg">
        <div class="card-header bg-white text-center py-4 border-0">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 56px; height: 56px;">
            <i class="fas fa-address-book fa-2x"></i>
          </div>
          <h4 class="font-weight-bold mb-1">Directorio de Contactos</h4>
          <p class="text-muted small mb-0">Hubbec Enterprise Platform</p>
        </div>
        <div class="card-body p-4">
          <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle mr-2"></i>{{ errorMessage }}
          </div>

          <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="form-group mb-3">
              <label class="small font-weight-bold">Correo Electr&oacute;nico</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text bg-light border-right-0"><i class="fas fa-envelope text-muted"></i></span>
                </div>
                <input type="email" name="username" [(ngModel)]="credentials.Username" required class="form-control border-left-0" placeholder="correo@ejemplo.com">
              </div>
            </div>

            <div class="form-group mb-4">
              <label class="small font-weight-bold">Contrase&ntilde;a</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text bg-light border-right-0"><i class="fas fa-lock text-muted"></i></span>
                </div>
                <input type="password" name="password" [(ngModel)]="credentials.Pass" required class="form-control border-left-0" placeholder="********">
              </div>
            </div>

            <button type="submit" [disabled]="loading" class="btn btn-primary btn-block py-2 font-weight-bold">
              <span *ngIf="loading" class="spinner-border spinner-border-sm mr-2" role="status"></span>
              <span *ngIf="!loading"><i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesi&oacute;n</span>
            </button>
          </form>

          <div class="text-center mt-4">
            <p class="text-muted small mb-0">
              &iquest;No tienes una cuenta? <a routerLink="/register" class="font-weight-bold text-primary">Reg&iacute;strate aqu&iacute;</a>
            </p>
          </div>

          <div class="mt-4 pt-3 border-top text-center">
            <span class="badge badge-light text-muted p-2">
              <i class="fas fa-shield-alt mr-1"></i> JWT Bearer + EF Core + MongoDB Logs
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
